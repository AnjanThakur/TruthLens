[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "truthlens-backend"
version = "0.1.0"
description = "Evidence-attributed, multilingual forward checking API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "uvicorn>=0.34,<1",
  "Pillow>=11,<13", "PyMuPDF>=1.25,<2", "pytesseract>=0.3.13,<1",
  "trafilatura>=2,<3",
  "google-genai==2.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: paid/network integration (explicit opt-in only)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["pytesseract.*"]
ignore_missing_imports = true
