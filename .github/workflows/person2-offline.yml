name: TruthLens integration offline acceptance
on:
  push:
    branches: [feature/person2-whatsapp, integration/person2-scam-intelligence]
  pull_request:
    paths: ['frontend/**', 'whatsapp-adapter/**', 'supabase/**', 'backend/**', 'docs/scam-alert*', '.github/workflows/person2-offline.yml']
permissions:
  contents: read
jobs:
  scam-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      # Dedicated alert tests block live HTTP transports. This job does not
      # claim full backend/native-media acceptance; see combined-integration.md.
      - run: python -m pytest tests/test_alerts.py -q -p no:cacheprovider
      - run: python -m ruff check app tests scripts
      - run: python -m mypy app
      - run: python -m pip check
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      PLAYWRIGHT_CHANNEL: chromium
      USE_MOCK_API: 'false'
      NEXT_PUBLIC_USE_MOCK_API: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run test:integration
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: whatsapp-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-twilio-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install 'pytest==9.1.1' 'pytest-asyncio==1.4.0' 'ruff==0.17.0'
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m ruff check truthlens_whatsapp tests
      - run: python -m ruff format --check truthlens_whatsapp tests
      - run: python -m pip check
