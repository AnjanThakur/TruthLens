[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "truthlens-whatsapp-adapter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "pydantic-settings==2.15.0", "psycopg[binary]==3.3.6", "cryptography==50.0.0", "jsonschema==4.26.0"]

[tool.setuptools.package-data]
truthlens_whatsapp = ["backend-openapi.json"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]
qr = ["qrcode==8.2"]

[tool.setuptools.packages.find]
include = ["truthlens_whatsapp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
